# Platform-specific rules. The agent uses these to shape output per channel.
# Character limits are enforced in post-processing; the prompt also surfaces
# them to the model so it writes to length the first time.

website:
  title_max_chars: 120
  description_max_chars: 4000
  format: "markdown"
  languages: ["en", "ar"]
  sections:
    - hero_headline
    - subheadline
    - key_highlights   # 3-5 bullets
    - lifestyle_narrative
    - specifications
    - amenities
    - location
    - pricing
    - cta
  tone_override: null   # use brand default
  include_hashtags: false
  notes: >
    Markdown output is consumed by the Alwalaa CMS. Use h1 for hero_headline,
    h2 for each section. Include a structured specs table.

instagram:
  caption_max_chars: 2200
  caption_ideal_chars: 1400
  format: "plain_text"
  languages: ["en", "ar"]      # produce a bilingual caption
  sections:
    - hook           # 1-line attention grabber, no hashtags
    - body           # 3-5 short paragraphs, line-breaks between
    - cta
    - hashtags       # 20-30 relevant tags, end of caption
  tone_override: "slightly more aspirational, sensory, but still restrained"
  include_hashtags: true
  hashtag_strategy: "mix branded + location + property type + lifestyle"
  emoji_policy: "sparing, tasteful only (e.g., ✦, ◆, 🕊). No balloons or money."
  notes: >
    Arabic caption follows English, separated by a divider line (— — —).
    Put phone/whatsapp in the caption since IG strips links from post body.

dubizzle:
  title_max_chars: 80
  description_max_chars: 6000
  format: "plain_text"
  languages: ["en"]    # Dubizzle UAE is primarily English
  required_fields:
    - title
    - description
    - price
    - bedrooms
    - bathrooms
    - area_sqft
    - property_type
    - completion_status
    - rera_permit
  sections:
    - description_paragraph_1   # what & where
    - description_paragraph_2   # amenities & finishes
    - description_paragraph_3   # lifestyle & neighborhood
    - description_paragraph_4   # investment / transaction details
    - cta_line
  tone_override: "functional, scannable, SEO-aware. Lead with facts."
  include_hashtags: false
  seo_keywords_hint: "include neighborhood, bedroom count, and property type in first 2 lines"

opensouq:
  title_max_chars: 70
  description_max_chars: 3000
  format: "plain_text"
  languages: ["en", "ar"]
  sections:
    - short_description
    - bullet_specs
    - amenities_list
    - contact_block
  tone_override: "direct, practical, accessible. Reads well in both EN and AR."
  include_hashtags: false
  notes: >
    Arabic version is the primary field for OpenSouq. Provide both;
    the operator pastes into the correct language field.

bayut:
  title_max_chars: 100
  description_max_chars: 5000
  format: "plain_text"
  languages: ["en"]
  required_fields:
    - title
    - description
    - price
    - bedrooms
    - bathrooms
    - area_sqft
    - property_type
    - rera_permit
    - dld_permit
  sections:
    - opener
    - features_bullets
    - amenities_bullets
    - location_paragraph
    - investment_note
    - cta
  tone_override: "professional, fact-dense. Bullet lists preferred."
  include_hashtags: false

property_finder:
  title_max_chars: 100
  description_max_chars: 5000
  format: "plain_text"
  languages: ["en"]
  required_fields:
    - title
    - description
    - price
    - bedrooms
    - bathrooms
    - area_sqft
    - property_type
    - rera_permit
  sections:
    - opener
    - property_details
    - amenities
    - community
    - cta
  tone_override: "upscale but informative. Property Finder skews premium-buyer."
  include_hashtags: false
