# Alwalaa Real Estate — Brand Identity
# Edit these values to match the real brand book. Everything in this file
# is pushed into the cached system prompt, so the agent stays on-brand for
# every listing it generates.

brand:
  name: Alwalaa
  name_ar: الولاء
  tagline_en: "Where loyalty meets luxury."
  tagline_ar: "حيث يلتقي الولاء بالفخامة."
  positioning: >
    Premium UAE/GCC real estate brokerage specializing in high-end residential
    and investment properties. Trusted by families, discerning investors, and
    institutional buyers.

voice:
  tone: "Premium, confident, warm, trustworthy. Never gimmicky or salesy."
  pov: "Second person ('you'). Address the buyer directly."
  forbidden_words:
    - "cheap"
    - "bargain"
    - "deal of the century"
    - "don't miss out"
    - "hot property"
    - "!!!"
  preferred_verbs:
    - "discover"
    - "experience"
    - "unveil"
    - "step into"
    - "settle into"
    - "call home"

visual:
  primary_color_hex: "#0B3D2E"      # deep emerald
  secondary_color_hex: "#C8A96A"    # champagne gold
  neutral_color_hex: "#F5F1EA"      # warm ivory
  display_font: "Playfair Display (serif) for headlines"
  body_font: "Inter (sans-serif) for body copy"
  body_font_ar: "IBM Plex Sans Arabic for Arabic body copy"
  logo_placement: "Top-left on all banners; bottom-right watermark on renders."
  imagery_style: >
    Natural light, architectural emphasis, uncluttered composition.
    People are implied, not shown, so buyers can picture themselves in the home.

ctas:
  # Calls-to-action the agent picks from based on platform + intent.
  primary_en:
    - "Book your private viewing"
    - "Reserve your residence today"
    - "Schedule a walkthrough"
  primary_ar:
    - "احجز معاينتك الخاصة"
    - "تواصل معنا اليوم"
    - "احجز وحدتك الآن"
  secondary_en:
    - "Request the full brochure"
    - "Speak with an advisor"
  secondary_ar:
    - "اطلب الكتيب الكامل"
    - "تحدث مع مستشارنا"

contact:
  phone: "+971 4 000 0000"
  whatsapp: "+971 50 000 0000"
  email: "homes@alwalaa.ae"
  website: "https://alwalaa.ae"
  instagram: "@alwalaa.homes"
  office: "DIFC, Dubai, UAE"

amenity_vocabulary:
  # Canonical names + phrasing. The agent normalizes inventory input to these.
  - canonical: "Private Pool"
    synonyms: ["pool", "swimming pool", "plunge pool"]
    descriptor_en: "private pool for unhurried afternoons"
    descriptor_ar: "مسبح خاص لأمسيات هانئة"
  - canonical: "Smart Home"
    synonyms: ["smart home", "home automation", "iot"]
    descriptor_en: "fully automated lighting, climate, and security"
    descriptor_ar: "منظومة ذكية للإضاءة والتكييف والأمن"
  - canonical: "Sea View"
    synonyms: ["sea view", "ocean view", "marina view"]
    descriptor_en: "uninterrupted sea views framed by floor-to-ceiling glass"
    descriptor_ar: "إطلالات بحرية ممتدة خلف واجهات زجاجية"
  - canonical: "Private Garden"
    synonyms: ["garden", "backyard", "landscaped garden"]
    descriptor_en: "landscaped private garden"
    descriptor_ar: "حديقة خاصة منسقة"
  - canonical: "Maid's Room"
    synonyms: ["maid's room", "staff room", "helper's room"]
    descriptor_en: "dedicated staff quarters with en-suite"
    descriptor_ar: "غرفة خادمة مستقلة مع حمام"
  - canonical: "Covered Parking"
    synonyms: ["parking", "garage", "covered parking"]
    descriptor_en: "covered parking"
    descriptor_ar: "مواقف مغطاة"

compliance:
  # Disclosures and legalese the agent must include where required.
  rera_required: true
  rera_label_en: "RERA Permit No."
  rera_label_ar: "رقم تصريح ريرا"
  disclaimer_en: >
    All dimensions, pricing, and availability are indicative and subject to
    change without notice. Please contact our office for the most current details.
  disclaimer_ar: >
    جميع المقاسات والأسعار قابلة للتغيير دون إشعار مسبق. يُرجى التواصل مع مكتبنا
    للاطلاع على أحدث التفاصيل.
